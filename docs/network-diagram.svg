<svg viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="760" fill="#ffffff"/>
  <text x="600" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#111">Multi-Cloud Network Architecture — AWS EKS Frontend / AKS Backend / Azure PostgreSQL</text>

  <!-- Internet -->
  <ellipse cx="600" cy="75" rx="90" ry="28" fill="#eef" stroke="#446"/>
  <text x="600" y="80" text-anchor="middle" font-size="14">Internet / End User</text>

  <!-- AWS box -->
  <rect x="40" y="140" width="500" height="580" fill="#fff7ec" stroke="#d99" stroke-width="2" rx="8"/>
  <text x="60" y="165" font-size="16" font-weight="bold" fill="#a55">AWS — VPC 10.0.0.0/16 (us-east-1)</text>

  <!-- AWS public subnet -->
  <rect x="70" y="185" width="440" height="110" fill="#ffe9cc" stroke="#c96" rx="6"/>
  <text x="85" y="205" font-size="13" font-weight="bold">Public subnet 10.0.0.0/24</text>
  <rect x="100" y="220" width="180" height="55" fill="#fff" stroke="#c96" rx="4"/>
  <text x="190" y="243" text-anchor="middle" font-size="12">ALB / Ingress</text>
  <text x="190" y="260" text-anchor="middle" font-size="11">(public, TLS terminates here)</text>
  <rect x="300" y="220" width="180" height="55" fill="#fff" stroke="#c96" rx="4"/>
  <text x="390" y="243" text-anchor="middle" font-size="12">NAT Gateway</text>
  <text x="390" y="260" text-anchor="middle" font-size="11">(egress only for nodes)</text>

  <!-- AWS private subnet -->
  <rect x="70" y="310" width="440" height="150" fill="#eaf5ea" stroke="#7a7" rx="6"/>
  <text x="85" y="330" font-size="13" font-weight="bold">Private subnet(s) 10.0.10.0/23</text>
  <rect x="100" y="345" width="380" height="95" fill="#fff" stroke="#7a7" rx="4"/>
  <text x="290" y="368" text-anchor="middle" font-size="13" font-weight="bold">EKS Cluster — Frontend App</text>
  <text x="290" y="386" text-anchor="middle" font-size="11">Worker nodes, no public IPs</text>
  <text x="290" y="402" text-anchor="middle" font-size="11">K8s NetworkPolicy restricts pod egress</text>
  <text x="290" y="418" text-anchor="middle" font-size="11">to the VPN-attached route only</text>

  <!-- AWS VPN Gateway subnet -->
  <rect x="70" y="475" width="440" height="90" fill="#eef" stroke="#66a" rx="6"/>
  <text x="85" y="495" font-size="13" font-weight="bold">VPN attachment</text>
  <rect x="100" y="510" width="380" height="45" fill="#fff" stroke="#66a" rx="4"/>
  <text x="290" y="537" text-anchor="middle" font-size="12">AWS Virtual Private Gateway (site-to-site IPsec VPN)</text>

  <!-- security notes AWS -->
  <rect x="70" y="580" width="440" height="120" fill="#fbeaea" stroke="#c66" rx="6"/>
  <text x="85" y="600" font-size="13" font-weight="bold" fill="#a33">Security controls</text>
  <text x="85" y="620" font-size="11">- Security Groups: ALB allows 443 from 0.0.0.0/0 only</text>
  <text x="85" y="636" font-size="11">- Node SG allows traffic only from ALB SG + VPN CIDR</text>
  <text x="85" y="652" font-size="11">- NACLs deny all inbound except required ports</text>
  <text x="85" y="668" font-size="11">- Secrets via AWS Secrets Manager (no plaintext env vars)</text>
  <text x="85" y="684" font-size="11">- No public IP on any node or pod</text>

  <!-- Azure box -->
  <rect x="660" y="140" width="500" height="580" fill="#eef5ff" stroke="#69c" stroke-width="2" rx="8"/>
  <text x="680" y="165" font-size="16" font-weight="bold" fill="#357">Azure — VNet 10.1.0.0/16 (West Europe)</text>

  <!-- Azure Gateway subnet -->
  <rect x="690" y="185" width="440" height="90" fill="#eef" stroke="#66a" rx="6"/>
  <text x="705" y="205" font-size="13" font-weight="bold">GatewaySubnet 10.1.0.0/27</text>
  <rect x="720" y="220" width="380" height="45" fill="#fff" stroke="#66a" rx="4"/>
  <text x="910" y="247" text-anchor="middle" font-size="12">Azure VPN Gateway (site-to-site IPsec VPN)</text>

  <!-- Azure AKS subnet -->
  <rect x="690" y="290" width="440" height="150" fill="#eaf5ea" stroke="#7a7" rx="6"/>
  <text x="705" y="310" font-size="13" font-weight="bold">AKS subnet 10.1.10.0/23 (private cluster)</text>
  <rect x="720" y="325" width="380" height="95" fill="#fff" stroke="#7a7" rx="4"/>
  <text x="910" y="348" text-anchor="middle" font-size="13" font-weight="bold">AKS Cluster — Backend API</text>
  <text x="910" y="366" text-anchor="middle" font-size="11">Private API server, internal ingress</text>
  <text x="910" y="382" text-anchor="middle" font-size="11">only (no public LoadBalancer)</text>
  <text x="910" y="398" text-anchor="middle" font-size="11">K8s NetworkPolicy restricts pod-to-pod</text>

  <!-- Azure DB subnet -->
  <rect x="690" y="455" width="440" height="110" fill="#ffe9cc" stroke="#c96" rx="6"/>
  <text x="705" y="475" font-size="13" font-weight="bold">DB subnet 10.1.20.0/26 (delegated)</text>
  <rect x="720" y="490" width="380" height="60" fill="#fff" stroke="#c96" rx="4"/>
  <text x="910" y="513" text-anchor="middle" font-size="12">Azure Database for PostgreSQL</text>
  <text x="910" y="530" text-anchor="middle" font-size="11">Flexible Server, VNet-integrated,</text>
  <text x="910" y="544" text-anchor="middle" font-size="10">public network access disabled</text>

  <!-- security notes Azure -->
  <rect x="690" y="580" width="440" height="120" fill="#fbeaea" stroke="#c66" rx="6"/>
  <text x="705" y="600" font-size="13" font-weight="bold" fill="#a33">Security controls</text>
  <text x="705" y="620" font-size="11">- NSGs on AKS subnet allow only VPN CIDR + intra-VNet</text>
  <text x="705" y="636" font-size="11">- Postgres: private access only, NSG scoped to AKS subnet</text>
  <text x="705" y="652" font-size="11">- K8s NetworkPolicy: only backend pods reach DB port 5432</text>
  <text x="705" y="668" font-size="11">- Secrets via Azure Key Vault (CSI driver), not env vars</text>
  <text x="705" y="684" font-size="11">- Private DNS Zone resolves DB FQDN to private IP only</text>

  <!-- Traffic flow arrows -->
  <line x1="600" y1="103" x2="290" y2="220" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="430" y="150" font-size="11" fill="#333">1. HTTPS request</text>

  <line x1="290" y1="440" x2="290" y2="510" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="300" y="475" font-size="11" fill="#333">2. API call</text>

  <line x1="480" y1="532" x2="720" y2="247" stroke="#333" stroke-width="2.5" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
  <text x="560" y="380" font-size="11" fill="#333" transform="rotate(-35 560 380)">3. IPsec VPN tunnel (private, encrypted)</text>

  <line x1="910" y1="265" x2="910" y2="325" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="920" y="300" font-size="11" fill="#333">4. Internal ingress</text>

  <line x1="910" y1="420" x2="910" y2="490" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="920" y="460" font-size="11" fill="#333">5. Private Endpoint (5432)</text>

  <text x="600" y="740" text-anchor="middle" font-size="12" fill="#555">Dashed line = cross-cloud IPsec VPN over the public internet (encrypted tunnel, no public app/DB endpoints exposed)</text>
</svg>
