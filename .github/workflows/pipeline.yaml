name: CI/CD

# Runs on every push/PR to main. Push+PR both get build/test/scan; only a
# push to main (i.e. a merge) goes on to push the image and deploy, so PRs
# never touch the registry or the live environment.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: henkel-assessment-app
  ACR_NAME: ${{ vars.ACR_NAME }}                       # e.g. henkelassessdevacr (no https://, no .azurecr.io)
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  CONTAINER_APP_NAME: ${{ vars.CONTAINER_APP_NAME }}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------
  # Build + unit test the app, then build the container image and smoke
  # test it locally (no registry/cloud access needed for this job).
  # ---------------------------------------------------------------------
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Run tests
        working-directory: app
        run: npm test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (local, for smoke test)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container
        run: |
          set -e
          container_id=$(docker run -d -p 8080:8080 ${{ env.IMAGE_NAME }}:${{ github.sha }})
          # give the app a moment to boot before probing it
          for i in $(seq 1 10); do
            if curl -sf http://localhost:8080/health; then
              echo "health check passed"
              break
            fi
            if [ "$i" -eq 10 ]; then
              echo "health check failed after 10 attempts"
              docker logs "$container_id"
              exit 1
            fi
            sleep 1
          done
          docker stop "$container_id"

  # ---------------------------------------------------------------------
  # SCA (dependency) scan + container image scan with Trivy.
  # Findings at HIGH/CRITICAL fail the build (see README "Security" for the
  # tradeoff discussion and how to grant a time-boxed exception via
  # .trivyignore instead of silently ignoring severity).
  # ---------------------------------------------------------------------
  security-scan:
    runs-on: ubuntu-latest
    needs: build-test
    permissions:
      contents: read
      security-events: write   # required to upload SARIF to code scanning
    steps:
      - uses: actions/checkout@v4

      - name: Dependency (SCA) scan - filesystem
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: app
          format: sarif
          output: trivy-fs-results.sarif
          severity: CRITICAL,HIGH
          exit-code: 0 # upload results first, then gate the build in the dedicated step below
          trivyignores: .trivyignore

      - name: Upload SCA SARIF to code scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-fs-results.sarif
          category: trivy-fs

      - name: Fail build on HIGH/CRITICAL dependency findings
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: app
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1
          trivyignores: .trivyignore

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for scanning
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha

      - name: Container image scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: sarif
          output: trivy-image-results.sarif
          severity: CRITICAL,HIGH
          exit-code: 0
          trivyignores: .trivyignore

      - name: Upload image scan SARIF to code scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-image-results.sarif
          category: trivy-image

      - name: Fail build on HIGH/CRITICAL image findings
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1
          trivyignores: .trivyignore

  # ---------------------------------------------------------------------
  # Build + push to ACR. Only runs for pushes to main (never on PRs), and
  # only after tests + security scans have passed.
  # Auth: OIDC federated identity via azure/login, no client secret stored
  # in GitHub - see README "Security" section.
  # ---------------------------------------------------------------------
  push:
    runs-on: ubuntu-latest
    needs: [build-test, security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write   # required for OIDC federated login
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR (via az, using the OIDC session - no admin password)
        run: az acr login --name "$ACR_NAME"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------
  # Deploy the newly pushed image to Container Apps, then validate it by
  # hitting the public FQDN's /health endpoint.
  # ---------------------------------------------------------------------
  deploy:
    runs-on: ubuntu-latest
    needs: push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy new image to Container Apps
        run: |
          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}"

      - name: Validate deployment
        run: |
          set -e
          fqdn=$(az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn -o tsv)
          for i in $(seq 1 10); do
            if curl -sf "https://$fqdn/health"; then
              echo "deployment validated: https://$fqdn/health is healthy"
              exit 0
            fi
            sleep 5
          done
          echo "deployment validation failed: /health did not become healthy"
          exit 1
